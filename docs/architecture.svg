<rect class="chip" x="725" y="620" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="638">updater</text>
</g>
<text class="t sub" x="565" y="678">规则只写一次;两端只在 adapter 层执行"状态赋值 / OS 调用 / 样式常量"</text>

