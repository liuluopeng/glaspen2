<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca8a04"/></marker>
</defs>
<style>
.bg{fill:#f8fafc}
.t{font-family:"PingFang SC","Hiragino Sans GB",Helvetica,Arial,sans-serif}
.h1{font-size:23px;font-weight:700;fill:#0f172a}
.h2{font-size:13px;fill:#475569}
.boxt{font-size:14px;font-weight:600;fill:#0f172a}
.sub{font-size:11.5px;fill:#475569}
.chip{fill:#ffffff;stroke:#93c5fd;stroke-width:1;rx:6}
.chipt{font-size:12px;fill:#1e40af;font-weight:600}
.note{font-size:11px;fill:#9a3412}
.line{stroke:#94a3b8;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
.dash{stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow)}
.gate{stroke:#ca8a04;stroke-width:1.2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow2)}
.label{font-size:11px;fill:#475569}
.mac{fill:#ede9fe;stroke:#7c3aed;stroke-width:1.5}
.win{fill:#dcfce7;stroke:#16a34a;stroke-width:1.5}
.core{fill:#e0f2fe;stroke:#0284c7;stroke-width:1.8}
.os{fill:#fff7ed;stroke:#ea580c;stroke-width:1.3;stroke-dasharray:6 4}
.ext{fill:#f1f5f9;stroke:#64748b;stroke-width:1.2}
.ci{fill:#fef9c3;stroke:#ca8a04;stroke-width:1.5}
.grouplabel{font-size:12px;font-weight:600;fill:#0369a1}
</style>
<rect class="bg" x="0" y="0" width="1600" height="1040"/>
<text class="t h1" x="36" y="44">glaspen2 当前架构(2026-11 · 跨平台单源重构后)</text>
<text class="t h2" x="36" y="72">core 拥有全部平台无关规则;macOS/Windows 壳只保留 OS adapter;两端通过 FFI / 同进程直调 / 契约闸门对齐</text>

<!-- macOS shell -->
<rect class="mac" x="36" y="96" width="474" height="340" rx="10"/>
<text class="t boxt" x="56" y="124">macOS 壳 · glaspen2(ObjC + Rust 入口)</text>
<rect class="ext" x="56" y="132" width="434" height="60" rx="7"/>
<text class="t boxt" x="70" y="155" font-size="12.5">事件 / 窗口 / 菜单(ObjC)</text>
<text class="t sub" x="70" y="176">CGEventTap · 覆盖层窗口 · 菜单栏 · 翻页系统动效</text>
<rect class="ext" x="56" y="200" width="434" height="56" rx="7"/>
<text class="t boxt" x="70" y="222" font-size="12.5">实时绘制 · panel.m</text>
<text class="t sub" x="70" y="243">raw_draw_dot/segment → 增量 DrawPlan(FFI 下发)</text>
<rect class="ext" x="56" y="264" width="434" height="50" rx="7"/>
<text class="t boxt" x="70" y="285" font-size="12.5">面板桥 · FRB 同进程</text>
<text class="t sub" x="70" y="304">api.rs ↔ Flutter 设置面板(DynamicLibrary.process)</text>
<rect class="os" x="56" y="322" width="434" height="96" rx="7"/>
<text class="t boxt" x="70" y="344" font-size="12.5">OS-only(合法两份,不合并)</text>
<text class="t sub" x="70" y="365">AppKit / CoreGraphics / 剪贴板 / 辅助功能权限</text>
<text class="t sub" x="70" y="385">DMG 安装器 · 更新解包 · 系统菜单动效</text>
<text class="t note" x="70" y="406">arch: adapter 层只允许做"翻译",不允许再放规则</text>

<!-- Flutter panel -->
<rect class="ext" x="36" y="456" width="474" height="84" rx="10"/>
<text class="t boxt" x="56" y="482">flutter_settings(Dart · 单一代码库)</text>
<text class="t sub" x="56" y="504">schema 驱动表单 · 无 Platform. 分支 · 只经桥工厂区分平台</text>
<text class="t sub" x="56" y="524">macOS 走 FRB;Windows 走命名管道(同一 UI 契约)</text>
<line class="line" x1="273" y1="456" x2="273" y2="440"/>
<text class="t label" x="281" y="452">FRB</text>

<!-- Windows shell -->
<rect class="win" x="1090" y="96" width="474" height="340" rx="10"/>
<text class="t boxt" x="1110" y="124">Windows 壳 · glaspen-windows(Rust / Win32)</text>
<rect class="ext" x="1110" y="132" width="434" height="60" rx="7"/>
<text class="t boxt" x="1124" y="155" font-size="12.5">Raw HID / 窗口</text>
<text class="t sub" x="1124" y="176">WM_INPUT · wndproc · 覆盖层窗口 · 托盘</text>
<rect class="ext" x="1110" y="200" width="434" height="56" rx="7"/>
<text class="t boxt" x="1124" y="222" font-size="12.5">实时绘制</text>
<text class="t sub" x="1124" y="243">pen_modeler + paint_plan → DrawPlan(直调 core)</text>
<rect class="ext" x="1110" y="264" width="434" height="50" rx="7"/>
<text class="t boxt" x="1124" y="285" font-size="12.5">命名管道服务</text>
<text class="t sub" x="1124" y="304">\\.\pipe\glaspen2_settings(面板独立进程)</text>
<rect class="os" x="1110" y="322" width="434" height="96" rx="7"/>
<text class="t boxt" x="1124" y="344" font-size="12.5">OS-only(合法两份,不合并)</text>
<text class="t sub" x="1124" y="365">Win32 / GDI+DIB / RegisterHotKey 注册与占用降级</text>
<text class="t sub" x="1124" y="385">EXE 安装器 · 更新解包 · 焦点/Z-order/DPI</text>
<text class="t note" x="1124" y="406">arch: 与 macOS 的差异显式化,不静默统一</text>

<!-- Windows settings exe -->
<rect class="ext" x="1090" y="456" width="474" height="84" rx="10"/>
<text class="t boxt" x="1110" y="482">glaspen2_settings.exe(Flutter · 独立进程)</text>
<text class="t sub" x="1110" y="504">命名管道读写设置 / 热键 / 缩略图 / 页操作</text>
<text class="t sub" x="1110" y="524">与覆盖层同生命周期;面板不直接碰 DB</text>
<line class="line" x1="1327" y1="456" x2="1327" y2="440"/>
<text class="t label" x="1335" y="452">pipe</text>

<!-- core -->
<rect class="core" x="545" y="96" width="510" height="600" rx="12"/>
<text class="t boxt" x="565" y="124">glaspen-core(平台无关 · 唯一来源)</text>
<text class="t sub" x="565" y="143">13 个单源模块 · 307 个测试 · 只暴露 FFI/类型边界</text>
<rect class="chip" x="565" y="152" width="470" height="44" rx="7"/>
<text class="t chipt" x="577" y="172">export/ · FFI 面</text>
<text class="t sub" x="577" y="188">mod · pages · chat_glue · media · thumbs(只做翻译,不做规则)</text>

<text class="t grouplabel" x="565" y="222">单一来源规则(D1–D12)</text>
<g>
<rect class="chip" x="565" y="232" width="150" height="26" rx="6"/><text class="t chipt" x="577" y="250">ui</text>
<rect class="chip" x="725" y="232" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="250">settings</text>
