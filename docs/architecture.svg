<rect class="chip" x="725" y="368" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="386">i18n</text>
</g>

<text class="t grouplabel" x="565" y="420">绘制 / 模型(D9)</text>
<g>
<rect class="chip" x="565" y="430" width="150" height="26" rx="6"/><text class="t chipt" x="577" y="448">draw_spec</text>
<rect class="chip" x="725" y="430" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="448">modeler_session</text>
<rect class="chip" x="885" y="430" width="150" height="26" rx="6"/><text class="t chipt" x="897" y="448">modeler</text>
</g>

<text class="t grouplabel" x="565" y="482">数据 / 运行时</text>
<g>
<rect class="chip" x="565" y="492" width="150" height="26" rx="6"/><text class="t chipt" x="577" y="510">db</text>
<rect class="chip" x="725" y="492" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="510">state</text>
<rect class="chip" x="885" y="492" width="150" height="26" rx="6"/><text class="t chipt" x="897" y="510">device</text>
<rect class="chip" x="565" y="526" width="150" height="26" rx="6"/><text class="t chipt" x="577" y="544">presets</text>
<rect class="chip" x="725" y="526" width="150" height="26" rx="6"/><text class="t chipt" x="737" y="544">ocr</text>
