<!-- CI band -->
<rect class="ci" x="36" y="850" width="1528" height="150" rx="10"/>
<text class="t boxt" x="56" y="880">契约闸门 &amp; CI(防止再次写两份)</text>
<text class="t sub" x="56" y="906">• scripts/check-platform-parity.sh:无 Platform. 分支 / 无空壳 / 无 todo!/unimplemented! / 版本一致</text>
<text class="t sub" x="56" y="928">• core 契约测试(带负向验证):设置·动作·热键·协议·i18n·表单·快照·绘制·录制·camera/grid/minimap</text>
<text class="t sub" x="56" y="950">• Windows CI 阻塞门:cargo test + flutter build/test;lint 先跑 parity;两端改动必须同 PR</text>
<text class="t sub" x="56" y="972">• docs/duplication-backlog.md:19 项台账,仅 D9d 真机像素/性能待做;新增功能按 D14 规则先进 core</text>
