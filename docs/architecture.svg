<!-- chat -->
<rect class="ext" x="36" y="730" width="474" height="84" rx="8"/>
<text class="t boxt" x="56" y="756">glaspen-chat(gRPC 客户端)</text>
<text class="t sub" x="56" y="778">DraftInk / AppendMessages / ShareInk · mock 模式</text>
<text class="t sub" x="56" y="798">协议契约:proto/glaspen/chat/v1/chat.proto(唯一)</text>
<rect class="ext" x="1090" y="730" width="474" height="84" rx="8"/>
<text class="t boxt" x="1110" y="756">axum / kongde(ChatStore)</text>
<text class="t sub" x="1110" y="778">登录 / 草稿 / 直发 / 共享画布上行</text>
<text class="t sub" x="1110" y="798">独立服务,不可用时静默降级,不阻断涂鸦</text>
<path class="dash" d="M273 814 V836 H1327 V814"/>
