<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0369a1"/></marker>
    <marker id="arrowRose" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#be123c"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <style>
      .title{font-size:32px;font-weight:750;fill:#0f172a;letter-spacing:.3px}
      .subtitle{font-size:15px;fill:#475569}
      .group-title{font-size:19px;font-weight:700;fill:#0f172a}
      .group-sub{font-size:12.5px;fill:#64748b}
      .box-title{font-size:16px;font-weight:700;fill:#0f172a}
      .item{font-size:13px;fill:#334155}
      .mono{font-family:'SF Mono', Menlo, Consolas, monospace;font-size:12.5px;fill:#0f172a}
      .small{font-size:11.5px;fill:#64748b}
      .label{font-size:12px;fill:#475569}
      .legend{font-size:12.5px;fill:#475569}
      .box{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1800" height="1320" fill="#f8fafc"/>
  <text x="48" y="54" class="title">glaspen2 当前架构</text>
  <text x="48" y="82" class="subtitle">单源共享核心 + 平台专属壳；macOS = Rust 壳 + 3 个 Swift 原生文件；Windows = 纯 Rust 覆盖层</text>
  <text x="48" y="104" class="small">HEAD 4e9b5e7 · 2026-11-27 · macOS app-layer: 3 Swift / 2,370 lines + Rust 12,006 lines · ObjC: 0</text>

  <g>
    <rect x="40" y="126" width="1720" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" class="box"/>
    <text x="62" y="153" class="group-title">构建与链接（macOS 最终二进制）</text>
    <rect x="62" y="166" width="300" height="44" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="76" y="183" class="mono">cargo build</text>
    <text x="76" y="199" class="small">根 crate 入口；build.rs 先跑 Swift/Flutter</text>
    <path d="M362 188 H402" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="408" y="166" width="390" height="44" rx="8" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="422" y="183" class="mono">xcrun swiftc -c → libglaspen2_objc.a</text>
    <text x="422" y="199" class="small">+ fvm flutter build macos-framework</text>
    <path d="M798 188 H838" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="844" y="166" width="430" height="44" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="858" y="183" class="mono">rustc: root rlib + glaspen-macos rlib</text>
    <text x="858" y="199" class="small">+ Swift archive + Flutter frameworks + cairo</text>
    <path d="M1274 188 H1314" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="1320" y="166" width="420" height="44" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="1334" y="183" class="mono">target/debug/glaspen2</text>
    <text x="1334" y="199" class="small">macOS app binary；cdylib 供 FRB 面板</text>
  </g>

  <g>
    <rect x="40" y="254" width="610" height="488" rx="16" fill="#f0f9ff" stroke="#7dd3fc" class="box"/>
    <text x="62" y="285" class="group-title">macOS 原生层</text>
    <text x="62" y="305" class="group-sub">crates/glaspen-macos · target_os = "macos"</text>
    <rect x="62" y="322" width="566" height="160" rx="10" fill="#ffffff" stroke="#bae6fd"/>
    <text x="78" y="346" class="box-title">Swift 原生壳 · swift/（3 files, 2,370 lines）</text>
    <text x="78" y="367" class="mono">App/run_glue.swift（922） · Menu/menu_runtime.swift（771）</text>
    <text x="78" y="384" class="mono">Surface/tunnel_animation.swift（677）</text>
    <text x="78" y="407" class="item">NSApplication / NSMenu / NSStatusItem / FlutterViewController</text>
    <text x="78" y="425" class="item">CGEventTap 安装 · ScreenCaptureKit 保存/反色 · 菜单图标与富文本</text>
    <text x="78" y="443" class="item">Swift 参考实现 / parity 探针 / C ABI 薄桥</text>
    <text x="78" y="466" class="small">剩余 Swift 是不可直接由 core 表达的原生对象与系统框架边界</text>
    <rect x="62" y="500" width="566" height="42" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="78" y="517" class="mono">C ABI：Bridging.h + rust_ffi.h</text>
    <text x="78" y="533" class="small">Swift @_cdecl ↔ Rust extern "C"；符号/签名保持稳定</text>
    <path d="M345 482 V500" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <path d="M345 542 V560" stroke="#0369a1" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <rect x="62" y="560" width="566" height="160" rx="10" fill="#ffffff" stroke="#bae6fd"/>
    <text x="78" y="584" class="box-title">Rust macOS 壳 · src/macos_shell.rs（~12,000 lines）</text>
    <text x="78" y="605" class="item">AppKit/NSWindow/NSMenu/status icon、UI 锚点、压感窗</text>
    <text x="78" y="623" class="item">事件路由/菜单动作/热键/相机/隧道定时器/信号/剪贴板</text>
    <text x="78" y="641" class="item">overlay 绘制编排、C ABI 导出、启动编排</text>
    <text x="78" y="661" class="mono">src/entry.rs → macos_run()</text>
    <text x="78" y="681" class="mono">src/lib.rs → pub use glaspen_macos as macos</text>
    <text x="78" y="704" class="small">大量 unsafe objc2 / raw msg_send；这是当前主要复杂度来源</text>
  </g>

  <g>
    <rect x="690" y="254" width="470" height="270" rx="16" fill="#f5f3ff" stroke="#c4b5fd" class="box"/>
    <text x="712" y="285" class="group-title">根 crate：glaspen2</text>
    <text x="712" y="305" class="group-sub">平台入口 + FRB 面板 API + 日志/更新</text>
    <rect x="712" y="322" width="426" height="180" rx="10" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="728" y="346" class="mono">src/main.rs</text>
    <text x="728" y="364" class="small">统一日志 / panic hook / 平台入口分发 / updater 拦截</text>
    <text x="728" y="388" class="mono">src/api.rs + src/frb_generated.rs</text>
    <text x="728" y="406" class="small">Flutter Rust Bridge 面板 API（设置/快照/缩略图/页面…）</text>
    <text x="728" y="430" class="mono">src/logging.rs · src/updater.rs</text>
    <text x="728" y="448" class="small">按天滚动日志 / 崩溃记录 / 自更新帮手</text>
    <text x="728" y="474" class="small">target: macOS 依赖 glaspen-macos；Windows 依赖 glaspen-windows</text>
  </g>

  <g>
    <rect x="1200" y="254" width="560" height="488" rx="16" fill="#fffbeb" stroke="#fcd34d" class="box"/>
    <text x="1222" y="285" class="group-title">Windows 原生层</text>
    <text x="1222" y="305" class="group-sub">crates/glaspen-windows · 纯 Rust</text>
    <rect x="1222" y="322" width="516" height="230" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="1238" y="346" class="box-title">Win32 覆盖层（单 Rust 运行时）</text>
    <text x="1238" y="370" class="item">窗口/overlay：分层窗口、穿透/绘制、DWM</text>
    <text x="1238" y="390" class="item">输入：Raw Input / Pointer / 笔压 / 滚轮</text>
    <text x="1238" y="410" class="item">热键：RegisterHotKey / WM_HOTKEY</text>
    <text x="1238" y="430" class="item">设置面板：独立进程 + 命名管道</text>
    <text x="1238" y="450" class="item">HUD / minimap / 录制 / 页面绘制</text>
    <text x="1238" y="477" class="small">没有 Swift/ObjC/C ABI 第二运行时；unsafe 集中且契约由 windows crate 生成</text>
    <rect x="1222" y="566" width="516" height="154" rx="10" fill="#ffffff" stroke="#fde68a"/>
    <text x="1238" y="590" class="box-title">外部 Win32 系统 API</text>
    <text x="1238" y="614" class="item">User32 / GDI / DWM / HID / Pointer / pipes</text>
    <text x="1238" y="634" class="item">无 AppKit、ScreenCaptureKit、NSView backing store</text>
    <text x="1238" y="658" class="small">行为更接近“直接调用系统 API”，但真机覆盖仍少于 macOS</text>
  </g>

  <path d="M690 389 H650" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="652" y="378" class="label">cfg(macos)</text>
  <path d="M1160 389 H1200" stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="1164" y="378" class="label">cfg(windows)</text>

  <g>
    <rect x="40" y="778" width="1110" height="470" rx="16" fill="#f0fdf4" stroke="#86efac" class="box"/>
    <text x="62" y="809" class="group-title">crates/glaspen-core · 平台无关共享核心</text>
    <text x="62" y="829" class="group-sub">唯一逻辑/状态/数学来源；macOS 与 Windows 都依赖它</text>
    <rect x="62" y="846" width="330" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="78" y="870" class="box-title">存储 / 数据</text>
    <text x="78" y="892" class="mono">db.rs · SQLite</text>
    <text x="78" y="910" class="item">screens / strokes / points / settings</text>
    <text x="78" y="930" class="item">缩略图缓存 · 无限画布存储</text>
    <rect x="408" y="846" width="330" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="424" y="870" class="box-title">绘制 / 模型</text>
    <text x="424" y="892" class="mono">modeler · draw_spec · cairo_dl</text>
    <text x="424" y="910" class="item">笔迹平滑/预测/橡皮 · DrawPlan</text>
    <text x="424" y="930" class="item">camera / grid / minimap</text>
    <rect x="754" y="846" width="374" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="770" y="870" class="box-title">导出 / 页面</text>
    <text x="770" y="892" class="mono">export/ · pages · media · thumbs</text>
    <text x="770" y="910" class="item">PNG / SVG / GIF / PDF / XOJ</text>
    <text x="770" y="930" class="item">活页本 / 无限画布 / 圈选粘贴</text>
    <rect x="62" y="978" width="330" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="78" y="1002" class="box-title">录制 / i18n / 设置</text>
    <text x="78" y="1024" class="mono">recording · i18n · settings_snapshot</text>
    <text x="78" y="1042" class="item">录制状态机 · 文案表 · 快照 schema</text>
    <text x="78" y="1062" class="item">动作表 ui::ACTIONS / ActionEffect</text>
    <rect x="408" y="978" width="330" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="424" y="1002" class="box-title">聊天 / 共享接入</text>
    <text x="424" y="1024" class="mono">chat_glue · ink draft / share</text>
    <text x="424" y="1042" class="item">gRPC 调用 · 静默降级</text>
    <text x="424" y="1062" class="item">失败不阻断涂鸦</text>
    <rect x="754" y="978" width="374" height="116" rx="10" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="770" y="1002" class="box-title">更新 / FFI</text>
    <text x="770" y="1024" class="mono">update · updater · export/mod.rs</text>
    <text x="770" y="1042" class="item">GitHub 检查更新 / 自更新</text>
    <text x="770" y="1062" class="item">glaspen2_* C ABI 导出</text>
    <rect x="62" y="1112" width="1066" height="112" rx="10" fill="#ecfdf5" stroke="#86efac"/>
    <text x="78" y="1138" class="box-title">单源契约 / 回归闸门（当前重点）</text>
    <text x="78" y="1160" class="item">Camera::drag_pan_from_screen_delta / keyboard_pan_delta（方向唯一） · ui::ACTIONS（动作/默认键唯一）</text>
    <text x="78" y="1180" class="item">settings_snapshot / recording 状态机 / 页面与镜头数学 · core 单测 + 跨端源码闸门（pan_direction_single_source 等）</text>
    <text x="78" y="1204" class="small">原则：系统无关逻辑只写 core；adapter 只做坐标/框架转换 —— 但 Windows 真机/UI 验收仍不可由单源自动保证</text>
  </g>

  <g>
    <rect x="1180" y="778" width="580" height="470" rx="16" fill="#fff1f2" stroke="#fda4af" class="box"/>
    <text x="1202" y="809" class="group-title">面板 / 后端（外部）</text>
    <text x="1202" y="829" class="group-sub">Flutter 设置面板 · 聊天/共享服务</text>
    <rect x="1202" y="846" width="536" height="170" rx="10" fill="#ffffff" stroke="#fecdd3"/>
    <text x="1218" y="870" class="box-title">flutter_settings（Dart）</text>
    <text x="1218" y="894" class="item">macOS：进程内 FlutterViewController</text>
    <text x="1218" y="914" class="mono">FRB → root api.rs（DynamicLibrary.process）</text>
    <text x="1218" y="938" class="item">Windows：独立面板进程 + 命名管道</text>
    <text x="1218" y="958" class="mono">pipe ↔ glaspen-windows</text>
    <text x="1218" y="982" class="small">面板 UI 是跨平台 Dart 单源；宿主方式按平台不同</text>
    <rect x="1202" y="1036" width="536" height="110" rx="10" fill="#ffffff" stroke="#fecdd3"/>
    <text x="1218" y="1060" class="box-title">chat/ = glaspen-chat（Rust gRPC 客户端）</text>
    <text x="1218" y="1084" class="mono">proto/glaspen/chat/v1/chat.proto</text>
    <text x="1218" y="1104" class="item">草稿 / 直发 / 共享画布 · mock 模式 · 静默降级</text>
    <text x="1218" y="1124" class="item">依赖方向：core → glaspen-chat；主程序不阻塞涂鸦</text>
    <rect x="1202" y="1160" width="536" height="64" rx="10" fill="#ffffff" stroke="#fecdd3"/>
    <text x="1218" y="1184" class="box-title">axum ChatStore（独立服务）</text>
    <text x="1218" y="1204" class="small">外部 gRPC/HTTP；不可用不影响本地涂鸦</text>
  </g>

  <path d="M345 720 V778" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="356" y="752" class="label">Rust shell → core</text>
  <path d="M925 524 V778" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="936" y="640" class="label">依赖 core</text>
  <path d="M1480 742 C1480 760, 1180 745, 1140 778" stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="1210" y="748" class="label">Windows → core</text>

  <path d="M1180 930 C1160 930, 1130 520, 1108 524" stroke="#be123c" stroke-width="1.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowRose)"/>
  <text x="1020" y="720" class="label" fill="#be123c">FRB / pipe（按平台）</text>
  <path d="M1202 1090 C1160 1090, 1150 1100, 1110 1100" stroke="#be123c" stroke-width="1.5" fill="none" stroke-dasharray="6 5" marker-end="url(#arrowRose)"/>
  <text x="1000" y="1080" class="label" fill="#be123c">core → chat</text>

  <g>
    <rect x="40" y="1268" width="1720" height="38" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="58" y="1292" class="legend">实线：编译期依赖 / 调用　·　虚线：运行时协议（FRB / 命名管道）　·　C ABI：Swift @_cdecl ↔ Rust extern "C"　·　Swift 未参与的地方（Windows）为单 Rust 运行时</text>
  </g>
</svg>