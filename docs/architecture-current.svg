<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400">
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0369a1"/></marker>
  <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#15803d"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI",sans-serif}
  .bg{fill:#f8fafc}
  .title{font-size:32px;font-weight:750;fill:#0f172a;letter-spacing:.2px}
  .sub{font-size:15px;fill:#475569}
  .meta{font-size:12px;fill:#64748b}
  .h{font-size:18px;font-weight:700;fill:#0f172a}
  .box-title{font-size:15px;font-weight:700;fill:#0f172a}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12px;fill:#334155}
  .item{font-size:12.5px;fill:#475569}
  .small{font-size:11.5px;fill:#64748b}
  .label{font-size:11px;fill:#64748b}
  .chip{font-size:12px;font-weight:600;fill:#1e40af}
  .red{font-size:12px;font-weight:700;fill:#be123c}
  .green{font-size:12px;font-weight:700;fill:#15803d}
  .mac{fill:#f5f3ff;stroke:#7c3aed;stroke-width:1.6}
  .core{fill:#eff6ff;stroke:#2563eb;stroke-width:1.6}
  .win{fill:#ecfdf5;stroke:#059669;stroke-width:1.6}
  .bound{fill:#fff;stroke:#94a3b8;stroke-width:1.3}
  .chipbox{fill:#fff;stroke:#93c5fd;stroke-width:1}
  .line{stroke:#475569;stroke-width:1.6;fill:none;marker-end:url(#a)}
  .lineb{stroke:#0369a1;stroke-width:1.6;fill:none;marker-end:url(#ab)}
  .lineg{stroke:#15803d;stroke-width:1.6;fill:none;marker-end:url(#ag)}
</style>
<rect class="bg" width="1800" height="1400"/>
<text x="48" y="58" class="title">glaspen2 当前架构</text>
<text x="48" y="88" class="sub">typed protobuf 跨机器边界 · 单源共享核心 · 平台专属壳</text>
<text x="48" y="112" class="meta">HEAD ad6aa2f · 2026-11-28 · release 0.8.0 · macOS Swift 3 files / Rust shell · Windows 纯 Rust 覆盖层 · ObjC 应用层 0</text>
<rect x="1510" y="34" width="242" height="66" rx="10" fill="#0f172a"/>
<text x="1528" y="59" fill="#e2e8f0" font-size="12">协议边界</text>
<text x="1528" y="82" fill="#fff" font-size="15" font-weight="700">u32 LE + protobuf</text>

<!-- macOS column -->
<rect x="40" y="150" width="540" height="430" rx="14" class="mac" filter="url(#sh)"/>
<text x="64" y="181" class="h">macOS 主程序</text>
<text x="64" y="201" class="small">crates/glaspen-macos + 根 crate + Flutter 面板</text>
<rect x="62" y="220" width="496" height="104" rx="9" fill="#fff" stroke="#a78bfa"/>
<text x="80" y="244" class="box-title">Swift 原生层 · swift/（3 文件）</text>
<text x="80" y="267" class="mono">App/run_glue.swift · Menu/menu_runtime.swift</text>
<text x="80" y="285" class="mono">Surface/tunnel_animation.swift</text>
<text x="80" y="306" class="item">NSApplication / NSMenu / NSStatusItem / FlutterVC</text>
<text x="80" y="322" class="item">CGEventTap · ScreenCaptureKit · 系统标准控件</text>
<path d="M300 326 L300 350" class="line"/>
<rect x="62" y="352" width="496" height="150" rx="9" fill="#fff" stroke="#8b5cf6"/>
<text x="80" y="376" class="box-title">Rust macOS 壳 · macos_shell.rs</text>
<text x="80" y="398" class="item">事件路由 / 菜单动作 / 热键 / 相机 / 隧道定时器</text>
<text x="80" y="418" class="item">overlay 绘制编排 / minimap / 录制 / 信号 / 剪贴板</text>
<text x="80" y="438" class="item">AppKit / NSWindow 通过 objc2 unsafe 桥接</text>
<text x="80" y="463" class="mono">C ABI：Bridging.h + rust_ffi.h（typed，无 JSON）</text>
<text x="80" y="484" class="small">Swift 只保留系统框架/原生对象边界；业务逻辑在 Rust</text>
<path d="M300 502 L300 520" class="lineb"/>
<text x="312" y="518" class="label">FRB 同进程调用</text>

<!-- core column -->
<rect x="620" y="150" width="560" height="430" rx="14" class="core" filter="url(#sh)"/>
<text x="644" y="181" class="h">共享核心与 IPC 契约</text>
<text x="644" y="201" class="small">crates/glaspen-core · crates/glaspen-ipc · 根 crate</text>
<rect x="644" y="220" width="512" height="82" rx="9" fill="#fff" stroke="#60a5fa"/>
<text x="662" y="244" class="box-title">根 crate glaspen2</text>
<text x="662" y="266" class="mono">src/main.rs · src/api.rs（FRB） · logging · updater</text>
<text x="662" y="286" class="item">平台入口分发 / 设置面板 API / 日志与更新 / 自更新帮手</text>
<path d="M900 302 L900 320" class="line"/>
<rect x="644" y="322" width="512" height="122" rx="9" fill="#fff" stroke="#3b82f6"/>
<text x="662" y="346" class="box-title">glaspen-core · 平台无关单源</text>
<text x="662" y="368" class="item">modeler / db / camera / grid / minimap / draw_spec / pages</text>
<text x="662" y="388" class="item">settings / settings_snapshot / settings_form / ui / i18n</text>
<text x="662" y="408" class="item">recording / action_effect / export / bubbles / update</text>
<text x="662" y="430" class="small">typed Rust API；平台差异只在 adapter 与显式参数</text>
<path d="M900 444 L900 462" class="line"/>
<rect x="644" y="464" width="512" height="94" rx="9" fill="#fff" stroke="#2563eb"/>
<text x="662" y="488" class="box-title">glaspen-ipc · 唯一线协议</text>
<text x="662" y="510" class="mono">Frame { protocolVersion, requestId, oneof body }</text>
<text x="662" y="530" class="item">编码：u32 LE 长度 + protobuf；Windows 首包 GPB1 magic</text>
<text x="662" y="549" class="small">AppSettings / Page / Bubble / UiConfig / PageOp / SettingsPatch / Error</text>

<!-- Windows column -->
<rect x="1210" y="150" width="550" height="430" rx="14" class="win" filter="url(#sh)"/>
<text x="1234" y="181" class="h">Windows 覆盖层</text>
<text x="1234" y="201" class="small">crates/glaspen-windows · 独立设置面板进程</text>
<rect x="1232" y="220" width="506" height="86" rx="9" fill="#fff" stroke="#34d399"/>
<text x="1250" y="244" class="box-title">Flutter 设置面板（独立 exe）</text>
<text x="1250" y="266" class="mono">flutter_settings/ · Win32 命名管道客户端</text>
<text x="1250" y="286" class="item">typed Frame 请求/响应；按 reqId 匹配</text>
<path d="M1485 306 L1485 328" class="lineg"/>
<rect x="1232" y="330" width="506" height="108" rx="9" fill="#fff" stroke="#10b981"/>
<text x="1250" y="354" class="box-title">命名管道服务 · pipe.rs</text>
<text x="1250" y="376" class="mono">GPB1 + FrameDecoder → PanelInput（typed 分派）</text>
<text x="1250" y="396" class="item">GetSettings · SetSetting · PageOp · Thumbnails · Bubbles</text>
<text x="1250" y="416" class="item">GetUiConfig · Canvas · Backup/NAS · Update · Download</text>
<path d="M1485 438 L1485 456" class="lineg"/>
<rect x="1232" y="458" width="506" height="96" rx="9" fill="#fff" stroke="#059669"/>
<text x="1250" y="482" class="box-title">Win32 覆盖层 · 同进程</text>
<text x="1250" y="504" class="item">笔输入 / 绘制 / 托盘 / 热键 / 命名管道服务</text>
<text x="1250" y="524" class="item">直接调 glaspen-core typed API，不序列化</text>
<text x="1250" y="544" class="small">Windows 真机绘制/帧时间仍需单独验证</text>

<!-- boundary row -->
<rect x="40" y="620" width="870" height="300" rx="14" class="bound" filter="url(#sh)"/>
<text x="64" y="651" class="h">进程内边界</text>
<text x="64" y="672" class="small">macOS：Dart 设置面板 ↔ Rust（flutter_rust_bridge）</text>
<rect x="62" y="692" width="392" height="204" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="80" y="716" class="box-title">Dart ↔ Rust FRB</text>
<text x="80" y="740" class="item">Settings / UiConfig / PageInfo / PageThumbnail</text>
<text x="80" y="760" class="item">BubbleMessage / CanvasPayload / LensState</text>
<text x="80" y="780" class="item">PageOp / Backups / Update / ChatLogin</text>
<text x="80" y="802" class="mono">settings 结构体字段 + typed 返回值</text>
<text x="80" y="824" class="item">设置快照：snapshot_settings → encode_settings_frame_from</text>
<text x="80" y="844" class="item">UI schema：ui_config_typed → encode_ui_config_typed_frame</text>
<text x="80" y="870" class="green">生产路径不再解析整份 settings/uiConfig JSON</text>
<rect x="478" y="692" width="412" height="204" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="496" y="716" class="box-title">Swift ↔ Rust C ABI</text>
<text x="496" y="740" class="item">camera / canvas / page / recording / tunnel</text>
<text x="496" y="760" class="item">typed out 参数与 scalars；不经 JSON 文本</text>
<text x="496" y="780" class="item">overlay 绘制、菜单、状态栏由 Rust 编排</text>
<text x="496" y="802" class="mono">Bridging.h + rust_ffi.h</text>
<text x="496" y="824" class="item">已删除：camera_result_json / live_plan_json</text>
<text x="496" y="844" class="item">已删除：settings_apply / recording_event_json</text>
<text x="496" y="870" class="green">C ABI 只保留原生对象/系统框架边界</text>

<rect x="950" y="620" width="810" height="300" rx="14" class="bound" filter="url(#sh)"/>
<text x="974" y="651" class="h">跨进程边界</text>
<text x="974" y="672" class="small">Windows：Dart 面板 ↔ Rust 覆盖层（命名管道）</text>
<rect x="972" y="692" width="766" height="116" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="990" y="716" class="box-title">GPB1 帧协议</text>
<text x="990" y="740" class="mono">magic "GPB1" + [u32 LE len + protobuf Frame] ...</text>
<text x="990" y="762" class="item">请求/响应统一 Frame；一帧一消息，流式解析，无 JSON 命令行分派</text>
<text x="990" y="784" class="item">设置增量：SettingsPatch；错误：Error；页面操作：PageOpRequest/Response</text>
<rect x="972" y="818" width="766" height="78" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="990" y="842" class="box-title">已删除的旧边界</text>
<text x="990" y="864" class="red">Panel / google.protobuf.Struct / process_pipe_message / encode_response</text>
<text x="990" y="884" class="item">全部 Windows 命令与 macOS 内部 JSON FFI 已 typed 化</text>

<!-- typed domains -->
<rect x="40" y="960" width="1720" height="190" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#sh)"/>
<text x="64" y="992" class="h">typed 领域消息（protobuf / Rust typed）</text>
<text x="64" y="1014" class="small">AppSettings · Page · Bubble · UiConfig · Recording · Grid · Minimap · ActionEffect</text>
<g>
  <rect x="64" y="1032" width="252" height="34" rx="7" class="chipbox"/><text x="78" y="1054" class="chip">AppSettings / SettingsSnapshot</text>
  <rect x="330" y="1032" width="224" height="34" rx="7" class="chipbox"/><text x="344" y="1054" class="chip">Page / PageOp / Thumbnail</text>
  <rect x="568" y="1032" width="200" height="34" rx="7" class="chipbox"/><text x="582" y="1054" class="chip">BubbleMessages</text>
  <rect x="782" y="1032" width="214" height="34" rx="7" class="chipbox"/><text x="796" y="1054" class="chip">UiConfig 全量 typed</text>
  <rect x="1010" y="1032" width="204" height="34" rx="7" class="chipbox"/><text x="1024" y="1054" class="chip">PageOpRequest/Response</text>
  <rect x="1228" y="1032" width="190" height="34" rx="7" class="chipbox"/><text x="1242" y="1054" class="chip">SettingsPatch/Error</text>
  <rect x="1432" y="1032" width="300" height="34" rx="7" class="chipbox"/><text x="1446" y="1054" class="chip">CanvasOverviewRequest/Response</text>
  <rect x="64" y="1076" width="236" height="34" rx="7" class="chipbox"/><text x="78" y="1098" class="chip">RecordingEvent/Effect</text>
  <rect x="314" y="1076" width="206" height="34" rx="7" class="chipbox"/><text x="328" y="1098" class="chip">Grid / Minimap typed</text>
  <rect x="534" y="1076" width="220" height="34" rx="7" class="chipbox"/><text x="548" y="1098" class="chip">ActionEffect typed</text>
  <rect x="768" y="1076" width="244" height="34" rx="7" class="chipbox"/><text x="782" y="1098" class="chip">AppSettings.shortcuts map</text>
  <rect x="1026" y="1076" width="290" height="34" rx="7" class="chipbox"/><text x="1040" y="1098" class="chip">Bubble / UiConfig / Page typed</text>
</g>
<text x="64" y="1138" class="small">同进程 Rust → Rust 仍直接使用 typed Rust API；protobuf 只用于跨语言/跨进程边界。</text>

<!-- persistence / release -->
<rect x="40" y="1180" width="1720" height="160" rx="14" fill="#fff7ed" stroke="#fdba74"/>
<text x="64" y="1214" class="h">持久化与发布</text>
<text x="64" y="1240" class="item">SQLite 数据库仍保留 JSON 文本字段：strokes_json / bubbles / 缩略图等（有意不迁移，便于兼容与恢复）。</text>
<text x="64" y="1264" class="item">跨机器边界：Dart ↔ Rust FRB typed 结构；Dart ↔ Windows GPB1 protobuf；Swift ↔ Rust C ABI typed out 参数。</text>
<text x="64" y="1288" class="mono">release 0.8.0 · tag v0.8.0 · protobuf IPC 迁移 + 无限画布/网格/反色/描边/软阴影修复</text>
<text x="64" y="1312" class="small">验证：cargo build · core/ipc/root tests · flutter analyze/test · smoke-macos · platform parity；Windows 真机仍待验证。</text>
</svg>