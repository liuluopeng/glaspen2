[workspace]
members = ["installer"]

[package]
name = "glaspen2"
version = "0.4.0"
edition = "2024"

[lib]
name = "glaspen2"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dependencies]
image = "0.25"
gif = "0.13"
color_quant = "1.1"
flate2 = "1"
rayon = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
ink-stroke-modeler-rs = "0.1"
serde_json = "1.0.150"
base64 = "0.22"
chrono = "0.4"
libloading = "0.9"
printpdf = "0.10.0"
lopdf = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(windows)'.dependencies]
# Versions match C:\Users\liulu\Downloads\wAPItry (verified Windows pen-input prototype)
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
