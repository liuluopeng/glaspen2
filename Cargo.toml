[workspace]
members = ["installer", "chat", "crates/glaspen-core", "crates/glaspen-windows"]

# flutter_rust_bridge 的 #[frb] 宏会展开出 cfg(frb_expand) 供 codegen 使用,
# 声明一下, 免得 21 条 unexpected_cfgs 告警淹没真正的问题。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[package]
name = "glaspen2"
version = "0.5.2"
edition = "2024"

[lib]
name = "glaspen2"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
winresource = "0.1"

[dependencies]
# 根 crate 只剩壳:FRB 面板 API(api.rs)与平台入口。
# 存储/渲染/导出/更新的依赖(sqlx/tokio/image/gif/ureq/…)都在 glaspen-core。
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
flutter_rust_bridge = "=2.12.0"
glaspen-core = { path = "crates/glaspen-core" }
glaspen-windows = { path = "crates/glaspen-windows" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Versions match C:\Users\liulu\Downloads\wAPItry (verified Windows pen-input prototype)
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
