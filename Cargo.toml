[workspace]
members = ["installer", "chat", "crates/glaspen-core", "crates/glaspen-windows", "crates/glaspen-macos", "crates/glaspen-ipc"]
# installer 是 Windows-only 的 exe 桩(macOS 上链接不到 user32), 默认成员
# 排除它。chat 也排除: 它的 mock-send 是第二个 bin, 留在默认成员里会让
# 裸 `cargo run` 无法判断该跑哪个 bin(报 "could not determine which
# binary to run")。chat 测试由 CI / scripts/lint.sh 用 --workspace 覆盖。
default-members = [".", "crates/glaspen-core", "crates/glaspen-windows"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/liuluopeng/glaspen2"

# flutter_rust_bridge 的 #[frb] 宏会展开出 cfg(frb_expand) 供 codegen 使用,
# 声明一下, 免得 21 条 unexpected_cfgs 告警淹没真正的问题。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[package]
name = "glaspen2"
version.workspace = true
default-run = "glaspen2"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glaspen2"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cc = "1"
pkg-config = "0.3"
winresource = "0.1"

[dependencies]
# 根 crate 只剩壳:FRB 面板 API(api.rs)与平台入口。
# 存储/渲染/导出/更新的依赖(sqlx/tokio/image/gif/ureq/…)都在 glaspen-core。
serde_json = "1.0.150"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
flutter_rust_bridge = "=2.12.0"
glaspen-core = { path = "crates/glaspen-core" }
glaspen-ipc = { path = "crates/glaspen-ipc" }
glaspen-windows = { path = "crates/glaspen-windows" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
glaspen-macos = { path = "crates/glaspen-macos" }
[target.'cfg(windows)'.dependencies]
# Versions match C:\Users\liulu\Downloads\wAPItry (verified Windows pen-input prototype)
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_Pointer",
    "Win32_UI_WindowsAndMessaging",
] }
