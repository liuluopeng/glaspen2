[package]
name = "glaspen-core"
version = "0.5.1"
edition = "2024"
description = "glaspen2 共享核心:SQLite 存储、笔迹模型与平滑、cairo 渲染、导出、更新检查、聊天/草稿/共享上行 glue"

[build-dependencies]
pkg-config = "0.3"

[dependencies]
image = "0.25"
gif = "0.13"
color_quant = "1.1"
flate2 = "1"
rayon = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
ink-stroke-modeler-rs = "0.1"
glaspen-chat = { path = "../../chat" }
serde_json = "1.0.150"
printpdf = "0.10.0"
lopdf = "0.39"
base64 = "0.22"
chrono = "0.4"
libloading = "0.9"
ureq = "3.4.2"
sha2 = "0.11.0"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
