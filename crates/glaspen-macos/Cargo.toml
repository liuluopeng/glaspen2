[package]
name = "glaspen-macos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glaspen_macos"
path = "src/lib.rs"

[target.'cfg(target_os = "macos")'.dependencies]
glaspen-core = { path = "../glaspen-core" }
serde_json = "1.0.150"
libc = "0.2.189"
tracing = "0.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSMenu", "NSMenuItem", "NSCell", "NSWindow", "NSViewController", "NSRunningApplication", "NSShadow", "NSFont", "NSFontDescriptor", "NSStringDrawing", "NSAttributedString", "NSColor", "NSGraphics", "NSVisualEffectView", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSBezierPath", "NSGraphicsContext", "NSCursor", "objc2-quartz-core", "objc2-core-graphics",
  "NSResponder", "NSView", "NSApplication", "NSWorkspace", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSObject", "NSString", "NSAttributedString", "NSDictionary", "NSAffineTransform", "objc2-core-foundation"] }
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["objc2-core-graphics"] }
