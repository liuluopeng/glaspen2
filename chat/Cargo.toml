[package]
name = "glaspen-chat"
version = "0.1.0"
edition = "2024"
description = "glaspen 手写笔记聊天流消息:gRPC 客户端与本地模拟发送(消息存储在本地 axum 服务)"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.13"
