[package]
name = "glaspen-chat"
version = "0.1.0"
edition = "2024"
description = "glaspen 手写笔记聊天流消息:gRPC 客户端与本地模拟发送(消息存储在本地 axum 服务)"

[dependencies]
tonic = "0.13"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
# 登录换 token(docs/grpc-auth.md):与主程序同大版本;dev 的 HTTPS 是
# 自签证书(Caddy local),用 disable_verification 放行;json 提供 send_json
ureq = { version = "3", features = ["json"] }
serde_json = "1"

[build-dependencies]
tonic-build = "0.13"
