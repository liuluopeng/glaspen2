syntax = "proto3";

package glaspen.ipc.v1;

import "google/protobuf/struct.proto";

// 跨进程/跨语言边界的第一版 protobuf 契约。
//
// 目标: Dart(Flutter 设置面板) <-> Rust(覆盖层) 的命名管道、以及后续
// macOS/Flutter 的设置快照都走这一份 schema；不再把 JSON 文本放在线上。
//
// 约定:
// - 所有帧 = u32 little-endian 长度 + Frame protobuf bytes(长度不含前缀)；
// - protocol_version 用于拒绝不兼容的旧客户端；
// - request_id 由请求方生成, 响应原样带回;
// - 新增消息只加新的 oneof 分支/字段号, 字段号永不复用。
message Frame {
  uint32 protocol_version = 1;
  uint64 request_id = 2;
  oneof body {
    SettingsSnapshot settings_snapshot = 10;
    SetSetting set_setting = 11;
    SettingsSnapshotResponse settings_snapshot_response = 12;
    Ack ack = 13;
    SettingsChanged settings_changed = 14;
    PageListResponse page_list_response = 15;
    PageThumbnailsResponse page_thumbnails_response = 16;
    BubbleMessages bubble_messages = 17;
    PageOpResponse page_op_response = 18;
    GetSettingsRequest get_settings_request = 30;
    ListPagesRequest list_pages_request = 31;
    PageThumbnailsRequest page_thumbnails_request = 32;
    PageOpRequest page_op_request = 33;
    GetBubblesRequest get_bubbles_request = 34;
    NavigateToPageRequest navigate_to_page_request = 40;
    HotkeyCommand hotkey_command = 41;
    OpenUrlCommand open_url_command = 42;
    FlushBubblesRequest flush_bubbles_request = 43;
    AppVersionRequest app_version_request = 44;
    AppVersionResponse app_version_response = 45;
    CanvasOverviewRequest canvas_overview_request = 46;
    CanvasOverviewResponse canvas_overview_response = 47;
    BackupCommandRequest backup_command_request = 50;
    BackupOutcome backup_outcome = 51;
    ChatLoginRequest chat_login_request = 52;
    ChatLoginOutcome chat_login_outcome = 53;
    ExportPdfRequest export_pdf_request = 54;
    CheckUpdateRequest check_update_request = 60;
    UpdateInfo update_info = 61;
    NasBackupRequest nas_backup_request = 62;
    NasBackupOutcome nas_backup_outcome = 63;
    ApplyUpdateRequest apply_update_request = 64;
    ApplyUpdateOutcome apply_update_outcome = 65;
    DownloadUpdateRequest download_update_request = 70;
    DownloadProgress download_progress = 71;
    CancelDownloadRequest cancel_download_request = 72;
    UiConfigRequest ui_config_request = 80;
    UiConfigResponse ui_config_response = 81;
    Panel panel = 20;
    Error error = 99;
  }
}

// 设置值: 面板会传 bool/int/double/string/嵌套对象/数组。
// Struct 覆盖动态 JSON 兼容值; 后续稳定字段可以逐步改成 typed 子消息。
message SettingValue {
  oneof value {
    bool bool_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    string string_value = 4;
    google.protobuf.Struct struct_value = 5;
    ListValue list_value = 6;
    bytes bytes_value = 7;
    bool null_value = 8;
  }
}

message ListValue {
  repeated SettingValue values = 1;
}

// 设置快照的 typed 模型。字段与 core settings_snapshot 的稳定键一一对应;
// 不再用动态 map 承载整份设置。
message AppSettings {
  int32 color = 1;
  int32 width = 2;
  bool launch_at_login = 3;
  bool frosted_glass = 4;
  bool grid = 5;
  bool grid_follow_strokes = 6;
  bool glass_follow_strokes = 7;
  bool soft_shadow = 8;
  bool invert_ink = 9;
  bool notebook_style = 10;
  bool panel_transparent = 11;
  int32 invert_fps = 12;
  bool pressure_monitor = 13;
  bool outline = 14;
  bool infinite_canvas = 15;
  bool minimap = 16;
  double grid_size = 17;
  int32 grid_divider = 18;
  int32 flip_effect = 19;
  int32 gif_fps = 20;
  double gif_resolution = 21;
  double gif_speed = 22;
  int32 gif_end_mode = 23;
  string chat_api_base = 24;
  string chat_user = 25;
  bool chat_has_password = 26;
  bool chat_integration = 27;
  bool show_free_canvas = 28;
  bool show_bubble_tab = 29;
  int32 bubble_replay_speed = 30;
  bool bubble_replay_hold_last = 31;
  bool bubble_replay_auto = 32;
  bool bubble_auto_new_page = 33;
  string nas_url = 34;
  bool share_canvas = 35;
  string language = 36;
  map<string, string> shortcuts = 37;
}

message SettingsSnapshot {
  AppSettings settings = 1;
  map<string, string> metadata = 2;
}

message SettingsSnapshotResponse {
  SettingsSnapshot snapshot = 1;
}

message SetSetting {
  string key = 1;
  SettingValue value = 2;
}

message Ack {
  bool ok = 1;
}

message Error {
  string code = 1;
  string message = 2;
}


// Windows 面板管道的过渡信封: kind = 原 JSON 的 type 字符串,
// data = 原 data 对象(Struct 二进制, 不再是 JSON 文本)。
// 后续按消息逐步改成 typed 子消息, 这个 message 作为兼容入口保留。
message Panel {
  string kind = 1;
  google.protobuf.Value data = 2;
  bool ok = 3;
}

// Swift 与 Rust 之间的字符串表(快捷键表/菜单标题)。
message StringMap {
  map<string, string> values = 1;
}

message StringList {
  repeated string values = 1;
}

message SettingsChanged {
  SettingsSnapshot snapshot = 1;
}

message PageSummary {
  int64 id = 1;
  int32 width = 2;
  int32 height = 3;
  int32 stroke_count = 4;
}

message PageListResponse {
  repeated PageSummary pages = 1;
}

message PageThumbnail {
  int64 id = 1;
  bytes png = 2;
}

message PageThumbnailsResponse {
  repeated PageThumbnail thumbnails = 1;
}

message BubblePoint {
  double x = 1;
  double y = 2;
  double width = 3;
}

message BubbleStroke {
  uint32 rgb = 1;
  double width_scale = 2;
  uint64 gap_ms = 3;
  repeated BubblePoint points = 4;
}

message BubbleMessage {
  uint64 id = 1;
  uint64 ts_ms = 2;
  string device = 3;
  repeated BubbleStroke strokes = 4;
}

message BubbleMessages {
  string device = 1;
  repeated BubbleMessage messages = 2;
}

message Int64List {
  repeated int64 values = 1;
}

message PageOpResponse {
  string kind = 1;
  oneof result {
    bool ok = 2;
    Int64List ids = 3;
    string payload = 4;
    int32 count = 5;
  }
}

message GetSettingsRequest {}

message ListPagesRequest {}

message PageThumbnailsRequest {
  repeated int64 ids = 1;
  int32 max_size = 2;
}

// 页面操作请求: kind 区分 reorder/delete/lasso/move/...; 全 scalar/typed 字段,
// 不再用 Panel + Struct 承载参数。
message PageOpRequest {
  string kind = 1;
  int64 screen_id = 2;
  int64 anchor_id = 3;
  bool before = 4;
  repeated int64 ids = 5;
  // lasso 多边形 x,y 平铺。
  repeated double lasso = 6;
  int64 target_screen_id = 7;
  double dx = 8;
  double dy = 9;
  string payload = 10;
  double cx = 11;
  double cy = 12;
}

message GetBubblesRequest {}

message NavigateToPageRequest {
  int64 screen_id = 1;
}

message HotkeyCommand {
  string key = 1;
}

message OpenUrlCommand {
  string url = 1;
}

message FlushBubblesRequest {}

message AppVersionRequest {}

message AppVersionResponse {
  string version = 1;
}

enum CanvasAction {
  CANVAS_CURRENT = 0;
  CANVAS_HOME = 1;
  CANVAS_CENTER = 2;
  CANVAS_NEW = 3;
}

message CanvasOverviewRequest {
  int32 w = 1;
  int32 h = 2;
  CanvasAction action = 3;
}

message CanvasOverviewResponse {
  bytes png = 1;
  repeated double rect = 2;
}

enum BackupCommand {
  BACKUP_NOW = 0;
  RESTORE_LATEST = 1;
}

message BackupCommandRequest {
  BackupCommand command = 1;
}

message BackupOutcome {
  bool ok = 1;
  string message = 2;
  string kind = 3;
}

message ChatLoginRequest {}

message ChatLoginOutcome {
  bool ok = 1;
  string message = 2;
  string kind = 3;
}

message ExportPdfRequest {}

message CheckUpdateRequest {}

message UpdateInfo {
  bool ok = 1;
  string current = 2;
  string latest = 3;
  bool has_update = 4;
  string url = 5;
  string notes = 6;
  string error = 7;
}

message NasBackupRequest {}

message NasBackupOutcome {
  bool ok = 1;
  uint64 size_bytes = 2;
  uint64 stroke_count = 3;
  string error = 4;
  string hint = 5;
}

message ApplyUpdateRequest {}

message ApplyUpdateOutcome {
  bool ok = 1;
  string message = 2;
}

message DownloadUpdateRequest {}

message DownloadProgress {
  uint64 received = 1;
  uint64 total = 2;
  bool done = 3;
  string error = 4;
  string path = 5;
}

message CancelDownloadRequest {}

message UiConfigRequest {
  uint32 panel_protocol_version = 1;
}

message UiConfigResponse {
  UiConfig config = 1;
}

message UiConfig {
  string platform = 1;
  bool is_windows = 2;
  double font_scale = 3;
  string chord_separator = 4;
  map<string, string> chord_names = 5;
  string modifier_word = 6;
  map<string, LocalizedText> messages = 7;
  map<string, string> defaults = 8;
  map<string, string> hold_hotkeys = 9;
  repeated string reserved = 10;
  repeated string force_bound = 11;
  repeated string action_order = 12;
  UiModifierRow modifier_row = 13;
  map<string, bool> features = 14;
  repeated UiSettingSpec settings = 15;
  repeated UiFormSection settings_sections = 16;
  repeated UiCustomBlock settings_blocks = 17;
  uint32 protocol_version = 18;
}

message LocalizedText {
  string zh = 1;
  string en = 2;
}

message UiKeyCap {
  string name = 1;
  string label = 2;
  double width = 3;
  bool modifier = 4;
}

message UiModifierRow {
  repeated UiKeyCap left = 1;
  repeated UiKeyCap space = 2;
  repeated UiKeyCap right = 3;
}

message UiSettingSpec {
  string key = 1;
  string db_key = 2;
  string kind = 3;
  bool mac = 4;
  bool win = 5;
  UiFormMeta form = 6;
}

message UiFormMeta {
  string key = 1;
  string section = 2;
  int32 order = 3;
  string label_id = 4;
  string description_id = 5;
  string hint_id = 6;
  string control = 7;
  string layout = 8;
  bool show_label = 9;
  bool indented = 10;
  bool divider_before = 11;
  string unit = 12;
  UiFormRange range = 13;
  repeated UiFormOption options = 14;
  string visible_when_feature = 15;
  UiSettingCondition visible_when_setting = 16;
  UiSettingCondition enabled_when_setting = 17;
  bool advanced = 18;
}

message UiFormRange {
  double min = 1;
  double max = 2;
  double step = 3;
}

message UiFormOption {
  SettingValue value = 1;
  string label_id = 2;
}

message UiSettingCondition {
  string key = 1;
  SettingValue equals = 2;
}

message UiFormSection {
  string id = 1;
  string label_id = 2;
  bool advanced = 3;
  int32 order = 4;
  UiSettingCondition visible_when_setting = 5;
}

message UiCustomBlock {
  string id = 1;
  string section = 2;
  int32 order = 3;
  UiSettingCondition visible_when_setting = 4;
}
