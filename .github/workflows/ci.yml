name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 质量门:
# - fmt: 零依赖, 任何平台都能跑(ubuntu, 秒级)
# - clippy-test: 真正的门。需要 macOS + cairo + Flutter framework(ObjC 宿主
#   要用 Flutter 头文件)。**构建 framework 不需要 Apple 证书** —— 产物只做
#   linker-signed 的 ad-hoc 签名; 需要证书的是 build-dmg.sh 给 .app 签名那步,
#   那一步不在 CI 里。
# - windows-check: 只做编译检查(Windows 覆盖层/设置面板的代码在 macOS 上编不到)
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: rustfmt --check
        run: cargo fmt --check

  clippy-test:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # cairo: build.rs 用 pkg-config 取头文件, 运行时 cairo_dl 还会 dlopen
      # protobuf: chat/build.rs 的 tonic_build::compile_protos 需要 protoc
      - name: Install cairo and protoc
        run: brew install cairo pkg-config protobuf

      # 钉在本地 fvm 开发的同一版本(3.41.0):不钉的话 CI 会装最新
      # stable,新 Flutter 对 frb 2.12 生成代码的破坏会让 framework 构建
      # 只在 CI 上挂。升级 Flutter 时本地 fvm 与这里要同步改。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.0
          channel: stable
          cache: true

      - name: Build Flutter framework
        working-directory: flutter_settings
        run: flutter build macos-framework --release

      - name: clippy
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          exit ${PIPESTATUS[0]}
      # 失败时把错误行转成 ::error:: 注解 —— 匿名 API 只能读到注解读不到
      # 日志, 没有这一步远程排查只能靠猜。
      - name: clippy errors → annotations
        if: failure()
        run: |
          grep -E "^(error|warning: unused|warning: unreachable)" /tmp/clippy.log | head -40 | \
            while IFS= read -r line; do echo "::error::$line"; done
          # grep 没命中也要能看到失败现场: 日志尾部整段打进注解
          tail -25 /tmp/clippy.log | while IFS= read -r line; do
            echo "::error::TAIL ${line:0:300}"
          done
          exit 1

      - name: test
        run: cargo test

      - name: dart analyze
        working-directory: flutter_settings
        run: flutter analyze

  windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    # 新增且尚未在真实 runner 上验证(本机没有 Windows 工具链)。首次跑通后
    # 请删掉这一行, 让它成为真正的门。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy

      # chat/build.rs 用 tonic_build::compile_protos, 需要 protoc;
      # runner 镜像不一定自带(本机开发是自装的)
      - name: Ensure protoc
        run: |
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            choco install protoc -y
            echo "$env:CHOCOLATEYINSTALL\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      # 只编译不链接, 因此不需要 cairo DLL
      - name: cargo check (Windows)
        run: |
          cargo check --all-targets 2>&1 | Tee-Object -FilePath check.log
          exit $LASTEXITCODE
      - name: check errors → annotations
        if: failure()
        shell: bash
        run: |
          grep -E -A6 "^error" check.log | head -80 | \
            while IFS= read -r line; do echo "::error::${line:0:300}"; done
          tail -15 check.log | while IFS= read -r line; do
            echo "::error::TAIL ${line:0:300}"
          done
          exit 1
