name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting check — no compile step, runs anywhere.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: rustfmt --check
        run: cargo fmt --check

  # Clippy + tests on the primary target (macOS) — this is what we ship.
  # Requires the Flutter macOS framework: flutter build macos-framework
  # refuses to run without a *valid* (trusted) signing identity on runners,
  # so a self-signed cert is created and added to the system trust store.
  clippy-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - name: Install cairo
        run: brew install cairo pkg-config
      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create + trust signing identity
        run: |
          bash scripts/create-signing-cert.sh
          security find-certificate -c "Glaspen2 Development" -p > /tmp/gp-cert.pem
          openssl x509 -in /tmp/gp-cert.pem -outform der -out /tmp/gp-cert.der
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain /tmp/gp-cert.der
          security find-identity -v -p codesigning
      - name: Build Flutter macOS framework
        working-directory: flutter_settings
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter pub get
          flutter build macos-framework --release
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
