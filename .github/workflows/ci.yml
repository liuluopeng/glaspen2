name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting check — no compile step, runs anywhere.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: rustfmt --check
        run: cargo fmt --check

  # Clippy + tests on Linux: build.rs skips the macOS/Windows toolchains
  # (no Flutter frameworks, no clang/ObjC), so the shared Rust code is
  # checked without the macOS-specific setup that requires code signing.
  clippy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      # libcairo is dlopen'ed at runtime by cairo_dl (used by the unit tests)
      - name: Install libcairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
