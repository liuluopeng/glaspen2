name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 质量检查策略:
# - CI 只做 rustfmt (零依赖、永远可靠)
# - clippy + test 走本地 scripts/lint.sh — 因为 macOS CI 上构建
#   Flutter framework 需要签名身份, runner 无 Apple 证书, 自签名信任
#   方案也不稳定, 反复失败。clippy/test 依赖完整 macOS 工具链
#   (cairo + Flutter 框架链接), 本地每次 cargo build 都验证了编译。
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: rustfmt --check
        run: cargo fmt --check
